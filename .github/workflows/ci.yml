name: CI

on:
  push:
    branches: [master, web]
  pull_request:
    branches: [master, web]

jobs:
  dotnet:
    name: Build & Test (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AkilliBinaSistemi.sln

      - name: Build
        run: dotnet build AkilliBinaSistemi.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AkilliBinaSistemi.sln --no-build --configuration Release --verbosity normal

  ml-service:
    name: ML Service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ml_service/requirements.txt

      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0, 'ml_service'); import main; print('FastAPI app loads:', main.app.title)"

      - name: Docker build
        run: docker build -t adle-ml-service ./ml_service

  web:
    name: Web (API + React)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: adle_sim
          POSTGRES_USER: adle_user
          POSTGRES_PASSWORD: Password1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adle_user -d adle_sim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADLE_DB_CONNECTION: "Host=localhost;Port=5432;Database=adle_sim;Username=adle_user;Password=Password1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adle-web/package-lock.json

      # Build via csproj (not the .slnx solution — that format needs the .NET 9+
      # SDK). The web projects are pure net8.0 (no WPF), so they build on Linux;
      # building the test project compiles the API and all its dependencies too.
      - name: Build .NET web projects
        run: |
          dotnet restore Adle.Api/Adle.Api.csproj
          dotnet build Adle.Api/Adle.Api.csproj --no-restore --configuration Release
          dotnet build Adle.Api.Test/Adle.Api.Test.csproj --configuration Release

      # Create the schema + a minimal fixture the integration tests expect.
      - name: Load schema + seed
        env:
          PGPASSWORD: Password1
        run: |
          psql -h localhost -U adle_user -d adle_sim -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h localhost -U adle_user -d adle_sim -v ON_ERROR_STOP=1 -f db/seed-ci.sql

      # DB-backed HTTP integration suite (ml_service is stubbed in-process).
      - name: Integration tests (Adle.Api.Test)
        run: dotnet test Adle.Api.Test/Adle.Api.Test.csproj --no-build --configuration Release

      - name: Build React frontend
        working-directory: adle-web
        run: |
          npm ci
          npm run build

      - name: Docker build (API image)
        run: docker build -f Adle.Api/Dockerfile -t adle-api .
